<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Options - Student Wish</title>
    <style>
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            width: min(100% - 32px, 420px);
            padding: 32px;
            border: 1px solid #ffffff3b;
            border-radius: 16px;
            background: #071124c9;
            box-shadow: 0 18px 60px #0007;
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        .login-option {
            display: block;
            margin: 12px 0;
            padding: 20px;
            border: 1px solid #50caff;
            border-radius: 8px;
            background-color: #118cc9;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        .login-option:hover,
        .login-option:focus-visible {
            background-color: #0873a8;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #83dcff;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
</head>
<body class="image-background-page">
    <main>
        <h1>Choose a login option</h1>
        <a class="login-option" href="sinin.html">Student</a>
        <a class="login-option" href="admin-login.html">Admin</a>
        <a class="back-link" href="index.html">Back to home</a>
    </main>
</body>
</html>
